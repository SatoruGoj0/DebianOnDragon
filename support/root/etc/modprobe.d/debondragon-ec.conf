# DebOnDragon: the EC driver (fan control, thermal events) writes to the
# embedded controller as soon as it loads. Its match with this laptop's EC
# is strong but not yet confirmed on hardware, so it stays off until
# "sudo debondragon-ec-check" has queried the EC read-only. Enable with
# "sudo debondragon-ec-check --enable" (it rewrites this file).
blacklist qcom_hamoa_ec
