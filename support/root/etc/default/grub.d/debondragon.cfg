# Firmware leaves the display clocks and power domains on; keep them on
# until the msm display driver takes over.
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX clk_ignore_unused pd_ignore_unused regulator_ignore_unused"

# GRUB's graphical terminal has severe input lag with this laptop's GOP.
# The firmware text console remains responsive and does not change Linux's
# display driver or the framebuffer used after the kernel starts.
GRUB_TERMINAL=console

# Settings from /etc/default/debondragon, read in a subshell so nothing else
# from that file ends up in grub-mkconfig's environment.
debondragon_get() {
	[ -r /etc/default/debondragon ] || return 0
	(. /etc/default/debondragon; eval "echo \"\${$1:-}\"")
}

# HDMI (DEBONDRAGON_HDMI: auto, on or off; default auto).
# The HDMI link needs the lane mapping verified on hardware in kernel
# series 4 (data-lanes <3 2 1 0>). Devicetrees of older kernels have the
# mapping that fails link training, after which unplugging or disabling the
# output reset the laptop, so their boots get "video=HDMI-A-1:d" (connector
# forced off). The normal Debian entries load the newest kernel's
# devicetree (01_debondragon); 42_debondragon_kernels decides per kernel.
debondragon_hdmi_dtb_ok() { # release -> true if its devicetree drives HDMI
	case $1 in
	*-debondragon-[0-9]*) [ "${1##*-debondragon-}" -ge 4 ] 2>/dev/null ;;
	*) return 1 ;;
	esac
}
debondragon_newest=$(ls -1 /boot/dtb/debondragon-*.dtb 2>/dev/null |
	sed -e 's|^/boot/dtb/debondragon-||' -e 's|\.dtb$||' | sort -V | tail -n 1)
case $(debondragon_get DEBONDRAGON_HDMI) in
on) ;;
off) GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX video=HDMI-A-1:d" ;;
*) debondragon_hdmi_dtb_ok "$debondragon_newest" ||
	GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX video=HDMI-A-1:d" ;;
esac
unset debondragon_newest

# Pin the default boot entry to one kernel (DEBONDRAGON_DEFAULT_KERNEL).
# 02_debondragon_default also puts this entry first in the top-level menu and
# loads that kernel's own devicetree. Unset: Debian's default, newest kernel.
debondragon_default=$(debondragon_get DEBONDRAGON_DEFAULT_KERNEL)
if [ -n "$debondragon_default" ]; then
	GRUB_DEFAULT=debondragon-default
fi
unset debondragon_default

# Offer Windows Boot Manager in the GRUB menu.
GRUB_DISABLE_OS_PROBER=false
