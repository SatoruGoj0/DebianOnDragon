Syntax 4

# DebOnDragon: Lenovo IdeaPad Slim 3 15Q8X10 (83N3).
#
# UCM looks up conf.d/<driver>/<card long name>.conf. The long name comes
# from DMI (vendor-product-family-board), so it is the same for the default
# and the -speakers devicetree; the short card name, which would tell them
# apart, is cut to 31 characters ("X1E80100-LENOVO-IdeaPad-Slim3-1") and
# matches neither profile. The sound node's model in the devicetree is
# complete, so pick the profile from that.

If.debondragon_spk {
	Condition {
		Type RegexMatch
		String "${sys:firmware/devicetree/base/sound/model}"
		Regex "-SPK"
	}
	True.Include.spk.File "/conf.d/x1e80100/X1E80100-LENOVO-IdeaPad-Slim3-15Q8X10-SPK.conf"
	False.Include.default.File "/conf.d/x1e80100/X1E80100-LENOVO-IdeaPad-Slim3-15Q8X10.conf"
}
