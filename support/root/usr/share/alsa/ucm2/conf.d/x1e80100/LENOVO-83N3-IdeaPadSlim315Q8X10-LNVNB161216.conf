Syntax 4

# DebOnDragon: Lenovo IdeaPad Slim 3 15Q8X10 (83N3).
#
# UCM looks up conf.d/<driver>/<card long name>.conf. The long name comes
# from DMI (board vendor, product, product version, board name), so it is
# the same for every devicetree of this laptop. The short card name is the
# model with a 31-character cut ("X1E80100-LENOVO-IdeaPad-Slim3-1") and
# matches neither profile filename.

Include.card.File "/conf.d/x1e80100/X1E80100-LENOVO-IdeaPad-Slim3-15Q8X10.conf"
