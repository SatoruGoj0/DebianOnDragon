# DebOnDragon override of calamares-settings-debian's packages.conf.
# Debian's list names live-* packages this image doesn't ship
# (live-boot-doc, live-tools, live-task-*); apt-get then fails with code
# 100 and aborts the install. Remove only what is installed, and use
# try_remove so a missing package can never fail the installation.
backend: apt
operations:
  - try_remove:
      - 'live-boot'
      - 'live-config'
      - 'live-config-systemd'
      - 'calamares-settings-debian'
