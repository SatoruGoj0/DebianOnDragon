# Firmware leaves the display clocks and power domains on; keep them on
# until the msm display driver takes over.
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX clk_ignore_unused pd_ignore_unused regulator_ignore_unused"

# Settings from /etc/default/debondragon, read in a subshell so nothing else
# from that file ends up in grub-mkconfig's environment.
debondragon_get() {
	[ -r /etc/default/debondragon ] || return 0
	(. /etc/default/debondragon; eval "echo \"\${$1:-}\"")
}

# HDMI stays off until it works (DEBONDRAGON_HDMI, default "off").
# On 7.2.0-debondragon-2, DisplayPort link training to the HDMI converter
# fails; the display stays black and unplugging the cable or disabling the
# output then resets the laptop. "video=HDMI-A-1:d" makes DRM report the
# connector as disconnected, so the link is never enabled.
if [ "$(debondragon_get DEBONDRAGON_HDMI)" != on ]; then
	GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX video=HDMI-A-1:d"
fi

# Pin the default boot entry to one kernel (DEBONDRAGON_DEFAULT_KERNEL), via
# its entry in the "DebOnDragon kernels" submenu, which also loads that
# kernel's own devicetree. Unset: Debian's default, the newest kernel.
debondragon_default=$(debondragon_get DEBONDRAGON_DEFAULT_KERNEL)
if [ -n "$debondragon_default" ]; then
	GRUB_DEFAULT="debondragon-kernels>debondragon-$debondragon_default"
fi
unset debondragon_default

# Offer Windows Boot Manager in the GRUB menu.
GRUB_DISABLE_OS_PROBER=false
