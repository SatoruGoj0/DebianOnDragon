name: Build ISO

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'hardware-reports/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'hardware-reports/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the ISO as a GitHub release (tag = nightly-<run number>)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Fast checks in the same Debian release the packages target: shellcheck,
    # UCM include paths against Debian's alsa-ucm-conf, support package tests.
    # python3 runs debondragon-volkeys' self-test inside test-support.sh.
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends shellcheck alsa-ucm-conf python3
      - name: Shell syntax and shellcheck
        run: scripts/lint.sh
      - name: UCM include paths
        run: scripts/check-ucm.sh /usr/share/alsa/ucm2
      - name: debondragon-support behaviour tests
        run: scripts/test-support.sh

  build:
    if: github.event_name != 'pull_request'
    needs: checks
    # Native arm64: the root filesystem is assembled with chroot.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # build.sh reuses work/kernel-debs; rebuild only when the kernel inputs change.
      - name: Cache kernel packages
        uses: actions/cache@v4
        with:
          path: work/kernel-debs
          key: kernel-${{ hashFiles('kernel/**', 'dts/**', 'build.conf') }}

      - name: Build in Debian 13 container
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src debian:trixie ./build.sh
          sudo chown -R "$(id -u):$(id -g)" out work/kernel-debs

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: debondragon-iso
          path: |
            out/*.iso
            out/SHA256SUMS
            out/*.deb
          compression-level: 0
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            flags=""
          else
            tag=nightly-${GITHUB_RUN_NUMBER}
            flags="--prerelease --target $GITHUB_SHA"
          fi
          gh release create "$tag" out/*.iso out/SHA256SUMS out/*.deb \
            --title "DebOnDragon $tag" --notes-file docs/release-notes.md $flags
