# Built into BOOTAA64.EFI: find the DebOnDragon medium and load its menu.
# The marker file also works if a tool copied the ISO onto FAT.
# grub-mkstandalone puts the modules (linux, fdt, ...) in the memdisk inside
# BOOTAA64.EFI, but its default prefix is relative to $root. Pin it to the
# memdisk before $root moves to the ISO, or "linux" fails to load.
set prefix=(memdisk)/boot/grub
search --no-floppy --set=root --file /.debondragon
configfile ($root)/boot/grub/grub.cfg
