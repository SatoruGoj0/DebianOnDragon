# DebOnDragon: qcom-hamoa-ec writes the EC as soon as it loads (debug mode
# 0x30, plus 0x23 and 0x35). On the 83N3 those registers are the Windows
# fan protocol, not the Hamoa CRD protocol: 0x42 reads back fan count 0.
# Leave this driver blacklisted. Fan behaviour is debondragon-fan, which
# only reports SoC temperature (register 0x20) and suspend status (0x23).
blacklist qcom_hamoa_ec
