# DebOnDragon: Lenovo IdeaPad Slim 3 15Q8X10 (83N3).
# Speakers, headphones, headset mic and internal mics. Speaker controls are
# applied only when the amplifiers are bound, so an older devicetree that
# left them off still loads this profile for the headphone jack.

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/DebOnDragon-IdeaPad-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

# Userspace value 81 is -3 dB (0 = -84 dB) and is the maximum the x1e80100
# driver allows. wsa-macro/init.conf writes 84, which that limit rejects,
# so the boot sequence would abort and leave the level untouched.
If.wsa_dig {
	Condition {
		Type ControlExists
		Control "name='WSA WSA_RX0 Digital Volume'"
	}
	True.BootSequence [
		cset "name='WSA WSA_RX0 Digital Volume' 81"
		cset "name='WSA WSA_RX1 Digital Volume' 81"
	]
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"

If.wsa_map {
	Condition {
		Type ControlExists
		Control "name='SpkrLeft PA Volume'"
	}
	True.Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
}
