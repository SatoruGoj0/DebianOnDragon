# Shared build settings, sourced by build.sh and the stage scripts.
KERNEL_REPO=${KERNEL_REPO:-https://github.com/torvalds/linux.git}
KERNEL_REF=${KERNEL_REF:-v7.2}
KERNEL_LOCALVERSION=-debondragon

FIRMWARE_REPO=${FIRMWARE_REPO:-https://gitlab.com/kernel-firmware/linux-firmware.git}
FIRMWARE_REF=${FIRMWARE_REF:-main}

DEBIAN_SUITE=${DEBIAN_SUITE:-trixie}
DEBIAN_MIRROR=${DEBIAN_MIRROR:-http://deb.debian.org/debian}

BOARD_DTB=qcom/x1p42100-lenovo-ideapad-slim3-15q8x10.dtb
ISO_LABEL=DEBONDRAGON
ISO_NAME=${ISO_NAME:-debondragon-${DEBIAN_SUITE}-arm64}

# Kernel arguments every boot entry uses. Firmware leaves the display and
# its power domains running; without these the kernel turns them off
# before the msm driver takes over and the screen goes dark.
# regulator_ignore_unused: on hardware, regulator cleanup at ~30 s switched
# off VREG_EDP_3P3 and VBL9 (panel and backlight power) when no driver had
# claimed them, which blanks the firmware framebuffer.
BOOT_ARGS="clk_ignore_unused pd_ignore_unused regulator_ignore_unused"
